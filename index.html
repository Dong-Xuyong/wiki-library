<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Wiki Library — Kindle-like shelf and reader for YouTube wiki books." />
  <title>Wiki Bookshelf</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Encode+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="dong-ui/theme.css?v=2" />
  <link rel="stylesheet" href="/ui/shell.css?v=1" />
  <link rel="stylesheet" href="styles.css?v=3" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>" />
  <script src="dong-ui/theme.js"></script>
</head>
<body class="dx">
  <header class="dx-header">
    <a class="dx-home" href="/" aria-label="Home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
    </a>
    <h1 class="dx-title">Wiki Bookshelf</h1>
    <div class="dx-actions">
      <div class="header-meta" id="header-meta"></div>
      <button type="button" data-dong-theme-toggle aria-label="Toggle color theme"></button>
    </div>
  </header>

  <div id="app" class="dx-main">
    <main id="view-root">
      <div id="loading" class="state-panel dx-card">Loading library&hellip;</div>
    </main>

    <footer class="site-footer dx-card">
      <span>Read from the YouTube wiki corpus</span>
      <a href="https://dong-xuyong.github.io/wiki-library/">dong-xuyong.github.io/wiki-library</a>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
